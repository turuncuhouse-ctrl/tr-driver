# Portainer > Stacks > Add stack > Web editor
# Bu dosyada build YOKTUR. Image'i once sunucuda derle:
#   cd /mnt/1tb_disk/necipdrive && docker build -t trdriver:latest .
# Secret'lari Portainer environment / .env ile verin — repoya yazmayin.

services:
  app:
    image: trdriver:latest
    restart: unless-stopped
    ports:
      - "3080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://necipdrive:${POSTGRES_PASSWORD}@db:5432/necipdrive?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      SHARE_PASSWORD_SALT: ${SHARE_PASSWORD_SALT}
      DATA_DIR: /data/files
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://drive.neciparmagan.net.tr}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-}
      FREE_QUOTA_BYTES: "5368709120"
      MAX_UPLOAD_BYTES: "10737418240"
      MAX_UPLOAD_BATCH_BYTES: "10737418240"
      UPLOAD_CHUNK_BYTES: "8388608"
      SESSION_TTL: 24h
      SHARE_TOKEN_BYTES: "24"
    volumes:
      - /mnt/1tb_disk/necipdrive/data:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - necipdrive

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: necipdrive
      POSTGRES_USER: necipdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/1tb_disk/necipdrive/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necipdrive -d necipdrive"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - necipdrive

networks:
  necipdrive:
    driver: bridge
