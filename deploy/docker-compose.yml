# Portainer Stack için hazır Compose
# Portainer > Stacks > Add stack > Web editor veya Git repository
# Compose path (Git): deploy/docker-compose.yml

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: necipdrive:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-trdriver}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trdriver}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      SHARE_PASSWORD_SALT: ${SHARE_PASSWORD_SALT}
      DATA_DIR: /data/files
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://cloud.example.com}
      FREE_QUOTA_BYTES: ${FREE_QUOTA_BYTES:-5368709120}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10737418240}
      MAX_UPLOAD_BATCH_BYTES: ${MAX_UPLOAD_BATCH_BYTES:-10737418240}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-8388608}
      SESSION_TTL: ${SESSION_TTL:-24h}
      SHARE_TOKEN_BYTES: ${SHARE_TOKEN_BYTES:-24}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-PDtEkEVeAOcC76XWw8sjZbZDHlkS0Gl0S6x/s7whWe0=}
    volumes:
      - necipdrive_data:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - necipdrive

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trdriver}
      POSTGRES_USER: ${POSTGRES_USER:-trdriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - necipdrive_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-necipdrive} -d ${POSTGRES_DB:-necipdrive}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - necipdrive

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-cloud.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - necipdrive

volumes:
  necipdrive_data:
  necipdrive_db:
  caddy_data:
  caddy_config:

networks:
  necipdrive:
    driver: bridge
