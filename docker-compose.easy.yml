# EN KOLAY KURULUM - Portainer Web editor'e yapistir ve Deploy et.
# docker build GEREKMEZ. Kaynak kod /mnt/1tb_disk/necipdrive icinden mount edilir.
# ZORUNLU: asagidaki secret'lari kendi urettigin guclu degerlerle degistir.
# Domain: drive.neciparmagan.net.tr  ->  NPM: http://SUNUCU_IP:3080

services:
  app:
    image: golang:1.24-alpine
    working_dir: /app
    command: >
      sh -c "apk add --no-cache nodejs npm &&
      cd /app/web &&
      npm ci --no-audit --no-fund &&
      npm run build &&
      cd /app &&
      go build -ldflags='-X necipdrive/internal/version.Version=0.4.2' -o /tmp/trdriver ./cmd/server &&
      echo Built TR Driver 0.4.2 &&
      exec /tmp/trdriver"
    restart: unless-stopped
    ports:
      - "3080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://necipdrive:${POSTGRES_PASSWORD}@db:5432/necipdrive?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      SHARE_PASSWORD_SALT: ${SHARE_PASSWORD_SALT}
      DATA_DIR: /data/files
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://drive.neciparmagan.net.tr}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-}
      FREE_QUOTA_BYTES: "5368709120"
      MAX_UPLOAD_BYTES: "10737418240"
      MAX_UPLOAD_BATCH_BYTES: "10737418240"
      UPLOAD_CHUNK_BYTES: "8388608"
      UPLOAD_SESSION_TTL: 48h
      MAX_BATCH_FILES: "2000"
      MAX_CONCURRENT_CHUNKS: "2"
      SESSION_TTL: 24h
      SHARE_TOKEN_BYTES: "24"
      GOCACHE: /gocache
    volumes:
      - /mnt/1tb_disk/necipdrive:/app
      - /mnt/1tb_disk/necipdrive/data:/data/files
      - necipdrive_gomod:/go/pkg/mod
      - necipdrive_gocache:/gocache
      - necipdrive_node_modules:/app/web/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s
    networks:
      - necipdrive

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: necipdrive
      POSTGRES_USER: necipdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/1tb_disk/necipdrive/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necipdrive -d necipdrive"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - necipdrive

volumes:
  necipdrive_gomod:
  necipdrive_gocache:
  necipdrive_node_modules:

networks:
  necipdrive:
    driver: bridge
