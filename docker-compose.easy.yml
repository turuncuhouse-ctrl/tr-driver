# EN KOLAY KURULUM - Portainer Web editor'e yapistir ve Deploy et.
# docker build GEREKMEZ. Kaynak kod /mnt/1tb_disk/necipdrive icinden mount edilir.
# ZORUNLU: asagidaki secret'lari kendi urettigin guclu degerlerle degistir.
# Domain: drive.neciparmagan.net.tr  ->  NPM: http://SUNUCU_IP:3080

services:
  app:
    image: golang:1.24-alpine
    working_dir: /app
    command: >
      sh -c "apk add --no-cache nodejs npm wget &&
      cd /app/web &&
      npm ci --no-audit --no-fund &&
      npm run build &&
      test -f /app/web/dist/apps/TRDriver.apk || test -f /app/web/public/apps/TRDriver.apk || (echo 'ERROR: TRDriver.apk missing' && exit 1) &&
      ls -la /app/web/dist/apps/TRDriver.apk /app/web/public/apps/TRDriver.apk 2>/dev/null || true &&
      cd /app &&
      go build -ldflags="-X necipdrive/internal/version.Version=$(cat VERSION)" -o /tmp/trdriver ./cmd/server &&
      echo Built TR Driver $(cat VERSION) &&
      exec /tmp/trdriver"
    restart: unless-stopped
    ports:
      - "3080:8080"
      # Torrent eş bağlantıları (TCP + UDP). İç ve dış port aynı olmalıdır.
      - "${TORRENT_LISTEN_PORT:-42069}:${TORRENT_LISTEN_PORT:-42069}/tcp"
      - "${TORRENT_LISTEN_PORT:-42069}:${TORRENT_LISTEN_PORT:-42069}/udp"
    environment:
      GOTOOLCHAIN: local
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://necipdrive:${POSTGRES_PASSWORD}@db:5432/necipdrive?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      SHARE_PASSWORD_SALT: ${SHARE_PASSWORD_SALT}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FILE_CHANGE_RETENTION: ${FILE_CHANGE_RETENTION:-2160h}
      DEVICE_TOKEN_TTL: ${DEVICE_TOKEN_TTL:-0}
      DATA_DIR: /data/files
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://drive.neciparmagan.net.tr}
      LOCAL_TEL_KEY: ${LOCAL_TEL_KEY:-}
      LOCAL_TEL_DOMAIN: ${LOCAL_TEL_DOMAIN:-}
      LOCAL_TEL_TOKEN_TTL: ${LOCAL_TEL_TOKEN_TTL:-15m}
      LOCAL_TEL_AUTO_PROVISION: ${LOCAL_TEL_AUTO_PROVISION:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-}
      FREE_QUOTA_BYTES: ${FREE_QUOTA_BYTES:-0}
      MAX_UPLOAD_BYTES: "10737418240"
      MAX_UPLOAD_BATCH_BYTES: "10737418240"
      UPLOAD_CHUNK_BYTES: "8388608"
      UPLOAD_SESSION_TTL: 48h
      MAX_BATCH_FILES: "2000"
      MAX_CONCURRENT_CHUNKS: "2"
      SESSION_TTL: 24h
      SHARE_TOKEN_BYTES: "24"
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-PDtEkEVeAOcC76XWw8sjZbZDHlkS0Gl0S6x/s7whWe0=}
      GOCACHE: /gocache
      # --- Ortak Paylaşım + torrent (docs/SHARED_SPACE.md) ---
      SHARED_DIR: /data/paylasim
      SHARED_QUOTA_BYTES: ${SHARED_QUOTA_BYTES:-0}
      SHARED_QUOTA_WARN_PERCENT: ${SHARED_QUOTA_WARN_PERCENT:-90}
      SHARED_LINK_MAX_TTL: ${SHARED_LINK_MAX_TTL:-720h}
      TORRENT_ENABLED: ${TORRENT_ENABLED:-true}
      TORRENT_LISTEN_PORT: ${TORRENT_LISTEN_PORT:-42069}
      TORRENT_DOWNLOAD_LIMIT_KBPS: ${TORRENT_DOWNLOAD_LIMIT_KBPS:-0}
      TORRENT_UPLOAD_LIMIT_KBPS: ${TORRENT_UPLOAD_LIMIT_KBPS:-0}
      TORRENT_SEED_AFTER_COMPLETE: ${TORRENT_SEED_AFTER_COMPLETE:-true}
      TORRENT_DISABLE_DHT: ${TORRENT_DISABLE_DHT:-false}
      # --- Backups (docs/BACKUP.md). BACKUP_PASSWORD yoksa zamanlayıcı kapalı kalır. ---
      TZ: ${TZ:-Europe/Istanbul}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: /data/backups/restic
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-02:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_MAX_AGE: ${BACKUP_MAX_AGE:-30h}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_RUN_ON_BOOT: ${BACKUP_RUN_ON_BOOT:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-trdriver}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - /mnt/1tb_disk/necipdrive:/app
      - /mnt/1tb_disk/necipdrive/data:/data/files
      - /mnt/1tb_disk/necipdrive/paylasim:/data/paylasim
      - /mnt/1tb_disk/necipdrive/backups:/data/backups
      - necipdrive_gomod:/go/pkg/mod
      - necipdrive_gocache:/gocache
      - necipdrive_node_modules:/app/web/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s
    networks:
      - necipdrive

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: necipdrive
      POSTGRES_USER: necipdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/1tb_disk/necipdrive/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necipdrive -d necipdrive"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - necipdrive

volumes:
  necipdrive_gomod:
  necipdrive_gocache:
  necipdrive_node_modules:

networks:
  necipdrive:
    driver: bridge
