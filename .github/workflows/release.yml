name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

  server-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  server-binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -ldflags="-s -w -X necipdrive/internal/version.Version=$(cat VERSION)" -o "dist/trdriver-${GOOS}-${GOARCH}${ext}" ./cmd/server
      - uses: actions/upload-artifact@v7
        with:
          name: trdriver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  android-apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured; skipping signed APK." >&2
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/keystore/keystore.properties <<PROPS
          storeFile=keystore/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Prepare release assets
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/TRDriver.apk
          VERSION_CODE=$(grep -Eo 'versionCode = [0-9]+' android/app/build.gradle.kts | grep -Eo '[0-9]+')
          printf '{\n  "minSupportedCode": 1,\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkPath": "/download/TRDriver.apk",\n  "releaseNotes": "TR Driver %s"\n}\n' "$VERSION_CODE" "$(cat VERSION)" "$(cat VERSION)" > dist/android/android-version.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/android/*

  github-release:
    needs: [server-binaries, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
