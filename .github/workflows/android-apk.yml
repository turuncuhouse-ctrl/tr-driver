name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit signed APK into web/public/apps"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured; a compatible signed update APK cannot be built." >&2
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/keystore/keystore.properties <<PROPS
          storeFile=keystore/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify update signature matches published APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs web/public/apps/TRDriver.apk > /tmp/old-certs.txt
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > /tmp/new-certs.txt
          old=$(grep -m1 'certificate SHA-256 digest' /tmp/old-certs.txt | awk '{print $NF}')
          new=$(grep -m1 'certificate SHA-256 digest' /tmp/new-certs.txt | awk '{print $NF}')
          if [ -z "$old" ] || [ "$old" != "$new" ]; then
            echo "Signing certificate does not match the published APK; refusing to publish an incompatible update." >&2
            cat /tmp/old-certs.txt /tmp/new-certs.txt
            exit 1
          fi
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TRDriver-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Read version code
        id: version
        run: echo "code=$(grep -Eo 'versionCode = [0-9]+' android/app/build.gradle.kts | grep -Eo '[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Publish signed APK into web/public/apps
        if: ${{ inputs.publish == 'true' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk web/public/apps/TRDriver.apk
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          code = int(os.environ['VERSION_CODE'])
          data = {
              "minSupportedCode": 1,
              "versionCode": code,
              "versionName": version,
              "apkPath": "/download/TRDriver.apk",
              "releaseNotes": "Kalıcı cihaz oturumu, güvenlik düzeltmeleri ve Android güncellemesi",
          }
          Path('web/public/apps/android-version.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/apps/TRDriver.apk web/public/apps/android-version.json
          git commit -m "release: Android $(cat VERSION) signed APK [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
