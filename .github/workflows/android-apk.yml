name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit signed APK into web/public/apps"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Missing Android signing secret::ANDROID_KEYSTORE_BASE64 is not configured; a compatible signed update APK cannot be built."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/keystore/keystore.properties <<PROPS
          storeFile=keystore/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Compare update signature with published APK
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          NEW_APK=android/app/build/outputs/apk/release/app-release.apk
          OLD_APK=web/public/apps/TRDriver.apk
          "$APKSIGNER" verify --print-certs "$NEW_APK" > /tmp/new-certs.txt
          new=$(grep -m1 'certificate SHA-256 digest' /tmp/new-certs.txt | awk '{print $NF}')
          if [ ! -f "$OLD_APK" ]; then
            echo "No published APK to compare; continuing with the new signing certificate."
            cat /tmp/new-certs.txt
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$OLD_APK" > /tmp/old-certs.txt || true
          old=$(grep -m1 'certificate SHA-256 digest' /tmp/old-certs.txt | awk '{print $NF}')
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "Published APK signing certificate matches."
            exit 0
          fi
          echo "::warning title=Android signing certificate changed::The new APK is signed with a different certificate than web/public/apps/TRDriver.apk. Existing installs must uninstall and reinstall; the publish step is allowed so a key rotation can ship."
          echo "----- published APK -----"
          cat /tmp/old-certs.txt || true
          echo "----- new APK -----"
          cat /tmp/new-certs.txt
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TRDriver-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Read version code
        id: version
        run: echo "code=$(grep -Eo 'versionCode = [0-9]+' android/app/build.gradle.kts | grep -Eo '[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Publish signed APK into web/public/apps
        if: ${{ inputs.publish == 'true' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk web/public/apps/TRDriver.apk
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          code = int(os.environ['VERSION_CODE'])
          apk = Path('web/public/apps/TRDriver.apk')
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          data = {
              "minSupportedCode": 1,
              "versionCode": code,
              "versionName": version,
              "apkPath": "/download/TRDriver.apk",
              "apkSha256": sha,
              "releaseNotes": "Tüm dosya türü yedeği (ses, belge, WhatsApp), artımlı yükleme ve uygulama içi güncelleme",
          }
          Path('web/public/apps/android-version.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/apps/TRDriver.apk web/public/apps/android-version.json
          git commit -m "release: Android $(cat VERSION) signed APK [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
